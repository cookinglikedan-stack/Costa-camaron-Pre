<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costa Camarón - Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rojo-coral: #D84A36;
            --rojo-oscuro: #a83224;
            --azul-marino: #213345;
            --azul-cobalto: #0047AB;
            --crema: #FFF8F5;
            --blanco: #FFFFFF;
            --sombra: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFF8F5 0%, #FFE8E3 50%, #FFD6CC 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(216, 74, 54, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 71, 171, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(216, 74, 54, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .profile-section {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--blanco);
            box-shadow:
                0 10px 30px rgba(216, 74, 54, 0.3),
                0 0 0 4px rgba(216, 74, 54, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(135deg, var(--rojo-coral), var(--azul-marino));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Shrimp SVG logo inside circle */
        .logo svg {
            width: 70px;
            height: 70px;
            color: white;
        }

        .logo:hover {
            transform: scale(1.05) rotate(3deg);
            box-shadow:
                0 15px 40px rgba(216, 74, 54, 0.4),
                0 0 0 6px rgba(216, 74, 54, 0.15);
        }

        .restaurant-name {
            font-family: 'Righteous', cursive;
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--rojo-coral), var(--azul-marino));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .handle {
            color: var(--rojo-oscuro);
            font-weight: 600;
            font-size: 0.95rem;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        /* ===== LINKS ===== */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .link-card {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px 25px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08),
                0 1px 3px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }
        .link-card:nth-child(4) { animation-delay: 0.4s; }
        .link-card:nth-child(5) { animation-delay: 0.5s; }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--rojo-coral), var(--azul-marino));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .link-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 12px 30px rgba(216, 74, 54, 0.25),
                0 4px 10px rgba(0, 0, 0, 0.1);
            border-color: rgba(216, 74, 54, 0.2);
        }

        .link-card:hover::before { opacity: 0.05; }

        .link-card:hover .card-icon {
            transform: scale(1.1) rotate(-5deg);
            background: linear-gradient(135deg, var(--rojo-coral), var(--azul-marino));
            color: white;
        }

        .link-card:hover .card-title { color: var(--rojo-coral); }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(216, 74, 54, 0.1), rgba(33, 51, 69, 0.08));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--rojo-coral);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .card-content {
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #2d2d2d;
            margin-bottom: 3px;
            transition: color 0.3s ease;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: #888;
            font-weight: 400;
        }

        .card-arrow {
            color: var(--rojo-coral);
            font-size: 1.2rem;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .link-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, var(--rojo-coral), #e86a59);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(216, 74, 54, 0.35);
            z-index: 2;
        }

        .badge.google {
            background: linear-gradient(135deg, #4285F4, #34A853);
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
        }

        /* ===== FOOTER SOCIAL ===== */
        .social-footer {
            text-align: center;
            animation: fadeInUp 0.8s ease-out 0.6s backwards;
        }

        .social-text {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--rojo-coral);
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--rojo-coral), var(--azul-marino));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 8px 25px rgba(216, 74, 54, 0.3);
            color: white;
        }

        .social-btn:hover::before { opacity: 1; }
        .social-btn i { position: relative; z-index: 1; transition: transform 0.3s ease; }
        .social-btn:hover i { transform: scale(1.1); }

        /* ===== DRIP TOP BAR ===== */
        .salsa-drip {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 8px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--rojo-coral) 20%,
                var(--azul-marino) 50%,
                var(--rojo-coral) 80%,
                transparent 100%);
            border-radius: 0 0 20px 20px;
            z-index: 10;
            opacity: 0.9;
        }

        /* ===== PARTICLES ===== */
        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--rojo-coral);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.25;
            animation: floatUp 20s infinite linear;
        }

        @keyframes floatUp {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.25; }
            90%  { opacity: 0.25; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container { padding: 30px 15px 50px; }
            .restaurant-name { font-size: 1.8rem; }
            .link-card { padding: 18px 20px; }
            .card-icon { width: 45px; height: 45px; font-size: 1.2rem; }
            .card-title { font-size: 1rem; }
        }
    </style>
    <base target="_blank">
</head>
<body>

    <div class="salsa-drip"></div>

    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 5s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 10s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 15s;"></div>

    <div class="container">

        <!-- HEADER -->
        <header class="profile-section">
            <div class="logo-container">
                <div class="logo">
                    <!-- Shrimp SVG icon -->
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M85 45C85 45 75 25 55 20C50 19 45 20 40 22C35 24 30 28 28 33C26 38 27 44 30 48C33 52 38 55 43 55C48 55 52 53 55 50C58 47 60 43 60 38C60 33 58 29 55 26" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M55 26C60 24 65 25 70 28C75 31 78 36 78 42C78 48 75 53 70 56C65 59 60 60 55 58" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M70 56C75 60 78 66 78 72C78 78 75 84 70 88" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M60 58C62 62 63 67 63 72C63 77 62 82 60 86" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M50 55C50 60 50 65 50 70C50 75 49 80 47 84" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <circle cx="33" cy="38" r="2.5" fill="white"/>
                        <path d="M25 42C20 44 15 48 12 53C10 58 10 64 13 69" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <path d="M20 50C15 52 12 56 12 61C12 66 15 70 20 72" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <path d="M28 48C23 50 20 54 20 59C20 64 23 68 28 70" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>
            </div>
            <h1 class="restaurant-name">Costa Camarón</h1>
            <p class="handle">@costa.camaron</p>
        </header>

        <!-- LINKS -->
        <nav class="links-container">

            <!-- Menú -->
            <a href="#" class="link-card">
                <div class="card-icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <div class="card-content">
                    <div class="card-title">Menú</div>
                    <div class="card-subtitle">Tacos, ceviches, aguachiles y más</div>
                </div>
                <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
            </a>

            <!-- Delivery WhatsApp -->
            <a href="https://wa.me/524491259869" class="link-card">
                <span class="badge">🔥 Pide ya</span>
                <div class="card-icon">
                    <i class="fas fa-motorcycle"></i>
                </div>
                <div class="card-content">
                    <div class="card-title">Delivery</div>
                    <div class="card-subtitle">Pedir por WhatsApp</div>
                </div>
                <div class="card-arrow"><i class="fas fa-external-link-alt"></i></div>
            </a>

            <!-- Ubicación Google Maps -->
            <a href="https://www.google.com/search?hl=es-419&gl=mx&q=Costa+Camar%C3%B3n,+Av.+Eugenio+Garza+Sada+104,+Constituci%C3%B3n,+20328+Aguascalientes,+Ags.&ludocid=10667898659210380512&lsig=AB86z5WER-4cnpN8dtHfiNuk1JS_#lrd=0x8429efbf9927a8cb:0x940bfd4f4219c4e0,3">
                <div class="card-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="card-content">
                    <div class="card-title">Ubicación</div>
                    <div class="card-subtitle">Ven a conocernos</div>
                </div>
                <div class="card-arrow"><i class="fas fa-external-link-alt"></i></div>
            </a>

            <!-- Reseña Google Maps -->
            <a href="https://www.google.com/search?hl=es-419&gl=mx&q=Costa+Camar%C3%B3n,+Av.+Eugenio+Garza+Sada+104,+Constituci%C3%B3n,+20328+Aguascalientes,+Ags.&ludocid=10667898659210380512&lsig=AB86z5WER-4cnpN8dtHfiNuk1JS_#lrd=0x8429efbf9927a8cb:0x940bfd4f4219c4e0,3"
               class="link-card"
               style="background: rgba(255,255,255,0.95); border: 2px solid transparent;">
                <span class="badge google">Maps</span>
                <div class="card-icon" style="background: linear-gradient(135deg, rgba(66,133,244,0.1), rgba(52,168,83,0.1)); color: #4285F4;">
                    <i class="fas fa-star" style="color: #FFB400;"></i>
                </div>
                <div class="card-content">
                    <div class="card-title" style="background: linear-gradient(135deg, #4285F4, #34A853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Reseña en Google</div>
                    <div class="card-subtitle">Califícanos en Google Maps ⭐</div>
                </div>
                <div class="card-arrow" style="color: #4285F4;"><i class="fas fa-external-link-alt"></i></div>
            </a>

        </nav>

        <!-- FOOTER SOCIAL -->
        <footer class="social-footer">
            <p class="social-text">Síguenos para más mariscos frescos 🦐</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/costa.camaron/" class="social-btn" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/profile.php?id=100076208973053" class="social-btn" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://wa.me/524491259869" class="social-btn" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="mailto:costacamaronags@gmail.com" class="social-btn" aria-label="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </footer>

    </div>

    <script>
        // Parallax suave en el logo
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('.logo');
            const x = (window.innerWidth / 2 - e.pageX) / 25;
            const y = (window.innerHeight / 2 - e.pageY) / 25;
            logo.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Ripple hover en cards
        document.querySelectorAll('.link-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
</body>
</html>
